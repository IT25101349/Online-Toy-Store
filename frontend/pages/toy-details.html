<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toy Details | Abi Toy Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/toys.css">
</head>
<body data-root=".." data-page="details">
  <div data-site-navbar></div>

  <main>
    <section class="page-hero page-hero--details">
      <div class="container">
        <a class="breadcrumb-link" href="../inventory">← Back to catalog</a>
        <span class="eyebrow">Product Overview</span>
        <h1>Comprehensive item details</h1>
        <p>View detailed specifications, availability, and management options for each product.</p>
      </div>
    </section>

    <section class="section-shell">
      <div class="container" id="toyDetailsContainer">
        <div class="details-loading">Loading toy details...</div>
      </div>
    </section>

    <section class="section-shell">
      <div class="container section-header-row">
        <div>
          <span class="eyebrow">More Inventory</span>
          <h2>Other toy records</h2>
        </div>
      </div>
      <div class="container product-grid" id="relatedGrid"></div>
    </section>
  </main>

  <div data-site-footer></div>

  <script src="../js/app.js"></script>
  <script src="../js/toy.js"></script>
</body>
</html>
